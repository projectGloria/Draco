<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Draco</title>
    <style>
      :root { color-scheme: dark; --bg:#090c12; --panel:#111620; --hover:#161d29; --line:rgba(148,163,184,.14); --text:#f1f5f9; --muted:#8e9aad; --accent:#38bdf8; --green:#22c55e; --orange:#f59e0b; }
      * { box-sizing: border-box; }
      body { margin:0; width:360px; max-height:580px; overflow-y:auto; font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 85% -10%,rgba(56,189,248,.12),transparent 38%),var(--bg); color:var(--text); }
      button,input { font:inherit; }
      header { padding:16px 16px 13px; display:flex; align-items:center; gap:10px; }
      .brand { width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 7px 12px rgba(245,90,11,.24)); }
      .title { font-size:14px; font-weight:700; letter-spacing:.01em; }
      .subtitle { color:var(--muted); font-size:11px; margin-top:1px; }
      .status-dot { margin-left:auto; width:9px; height:9px; border-radius:50%; background:var(--orange); box-shadow:0 0 0 4px rgba(245,158,11,.1); }
      .status-dot.active { background:var(--green); box-shadow:0 0 0 4px rgba(34,197,94,.1); }
      main { padding:0 12px 14px; display:grid; gap:9px; }
      .card { background:rgba(17,22,32,.92); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
      .card-title { padding:11px 12px 6px; color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; }
      .setting { min-height:46px; padding:8px 12px; display:flex; align-items:center; gap:10px; }
      .setting + .setting { border-top:1px solid var(--line); }
      .setting-copy { min-width:0; flex:1; }
      .setting-name { font-size:12.5px; font-weight:600; }
      .setting-note { color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .switch { position:relative; width:34px; height:20px; flex:none; }
      .switch input { position:absolute; opacity:0; }
      .track { position:absolute; inset:0; border-radius:99px; background:#293242; transition:.18s ease; cursor:pointer; }
      .track::after { content:''; position:absolute; width:14px; height:14px; top:3px; left:3px; border-radius:50%; background:#fff; transition:.18s ease; }
      .switch input:checked + .track { background:var(--orange); }
      .switch input:checked + .track::after { transform:translateX(14px); }
      .quiet { border:1px solid var(--line); background:transparent; color:#cbd5e1; padding:5px 9px; border-radius:7px; cursor:pointer; font-size:11px; }
      .quiet:hover:not(:disabled) { border-color:rgba(56,189,248,.55); color:#fff; background:rgba(56,189,248,.08); }
      .quiet.selected { border-color:rgba(245,158,11,.45); color:#fbbf24; background:rgba(245,158,11,.08); }
      button:disabled,input:disabled { opacity:.42; cursor:default; }
      form { padding:9px 10px 11px; display:flex; gap:7px; }
      input[type=url] { min-width:0; flex:1; border:1px solid var(--line); background:#0b1018; color:var(--text); border-radius:8px; padding:8px 9px; outline:none; }
      input[type=url]:focus { border-color:rgba(56,189,248,.65); box-shadow:0 0 0 3px rgba(56,189,248,.08); }
      .primary { border:0; border-radius:8px; padding:8px 12px; font-weight:700; color:#06121a; background:var(--accent); cursor:pointer; }
      #media { padding:3px 8px 8px; }
      .media-row { width:100%; display:flex; align-items:center; gap:8px; text-align:left; color:var(--text); padding:8px; border:0; border-radius:8px; background:transparent; cursor:pointer; }
      .media-row:hover { background:var(--hover); }
      .kind { padding:2px 5px; border-radius:5px; color:var(--accent); background:rgba(56,189,248,.1); font-size:9px; font-weight:700; text-transform:uppercase; }
      .url { color:var(--muted); min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .empty { color:var(--muted); font-size:11px; margin:5px 4px 8px; }
    </style>
  </head>
  <body>
    <header><img class="brand" src="icon.png" alt="" /><div><div class="title">Draco</div><div class="subtitle" id="status">Checking app…</div></div><span class="status-dot" id="status-dot"></span></header>
    <main>
      <section class="card"><div class="setting"><div class="setting-copy"><div class="setting-name">Pause Draco</div><div class="setting-note">Stop browser capture and page controls</div></div><label class="switch"><input id="paused" type="checkbox" /><span class="track"></span></label></div></section>
      <section class="card">
        <div class="card-title">This page</div>
        <div class="setting"><div class="setting-copy"><div class="setting-name">Channel</div><div class="setting-note" id="channel-note">Checking identity…</div></div><button class="quiet" id="channel" type="button">Exclude</button></div>
        <div class="setting"><div class="setting-copy"><div class="setting-name">Video</div><div class="setting-note" id="video-note">Checking identity…</div></div><button class="quiet" id="video" type="button">Exclude</button></div>
      </section>
      <section class="card"><div class="card-title">Send a link</div><form id="add"><input id="url" type="url" placeholder="https://…" required /><button class="primary" type="submit">Send</button></form></section>
      <section class="card"><div class="card-title">Media on this page</div><div id="media"><p class="empty">Nothing detected yet.</p></div></section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

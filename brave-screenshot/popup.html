<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame</title><link rel="stylesheet" href="styles.css"></head>
<body class="popup"><header><div class="brand-icon">⌗</div><div><h1>Frame</h1><p>A little piece of the web.</p></div><span class="tag">CAPTURE</span></header>
<main><h2>What would you like to capture?</h2>
<button class="capture primary" data-mode="full"><span class="mode-icon">↕</span><span><strong>Full page</strong><small>From the very top to the bottom</small></span><span class="arrow">↗</span></button>
<button class="capture" data-mode="section"><span class="mode-icon">⌖</span><span><strong>Select a section</strong><small>Drag a box around what matters</small></span><span class="arrow">↗</span></button>
<button class="capture" data-mode="visible"><span class="mode-icon">▣</span><span><strong>Visible area</strong><small>Everything you can see right now</small></span><span class="arrow">↗</span></button>
<p id="status" role="status" aria-live="polite">Your screenshot opens in a new tab.</p></main>
<footer><span class="dot"></span> On your device. Only yours.</footer><script src="popup.js" type="module"></script></body></html>

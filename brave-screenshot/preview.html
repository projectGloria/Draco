<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your screenshot · Frame</title><link rel="stylesheet" href="styles.css"></head>
<body class="preview"><header><div class="brand-icon">⌗</div><div><h1>Frame</h1><p id="details">Loading screenshot…</p></div><div class="actions"><button id="zoom" disabled>Actual size</button><button id="delete" disabled>Delete</button><a id="save" class="save" hidden>↓ Save PNG</a></div></header>

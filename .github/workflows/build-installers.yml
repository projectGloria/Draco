name: Build installers

# Draco is Windows-only: tools/prepare-runtime.mjs bundles win32-x64 yt-dlp/ffmpeg,
# the browser bridge is a Windows exe talking over a named pipe, and
# electron-builder.yml only defines Windows targets. So there is one runner.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The CLI installer ships this exact node.exe, so keep it on the
          # same major you develop with.
          node-version: '26'
          cache: npm

      - name: Set up Go (browser bridge host)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: host/go.mod
          cache: false # stdlib-only module, nothing to cache

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # Same steps as `npm run dist`, split up so electron-builder gets --publish never.
      - name: Fetch bundled runtime (yt-dlp, ffmpeg)
        run: npm run runtime

      - name: Build browser bridge host
        run: npm run host

      - name: Build app
        run: npm run build

      - name: Package NSIS installer and portable exe
        run: npx electron-builder --win --publish never

      - name: Package CLI-only installer
        run: npm run dist:cli:package

      - name: Collect installers
        shell: bash
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir -p installers
          cp "dist/Draco-$v-x64.exe"           "installers/Draco-$v-windows-x64-setup.exe"
          cp "dist/Draco-$v-portable.exe"      "installers/Draco-$v-windows-x64-portable.exe"
          cp "dist/Draco-CLI-$v-x64-Setup.exe" "installers/Draco-CLI-$v-windows-x64-setup.exe"
          (cd installers && sha256sum *.exe > SHA256SUMS.txt)
          ls -l installers

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers
          path: installers/
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers
          path: installers

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: installers/*
          generate_release_notes: true
          fail_on_unmatched_files: true

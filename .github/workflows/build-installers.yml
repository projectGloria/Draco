name: Build installers

# Draco is Windows-only: tools/prepare-runtime.mjs bundles win32-x64 yt-dlp/ffmpeg,
# the browser bridge is a Windows exe talking over a named pipe, and
# electron-builder.yml only defines Windows targets. So there is one runner.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The CLI installer ships this exact node.exe, so keep it on the
          # same major you develop with.
          node-version: '26'
          cache: npm

      - name: Set up Go (browser bridge host)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: host/go.mod
          cache: false # stdlib-only module, nothing to cache

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      # Same steps as `npm run dist`, split up so electron-builder gets --publish never.
      - name: Fetch bundled runtime (yt-dlp, ffmpeg)
        run: npm run runtime

      - name: Build browser bridge host
        run: npm run host

      - name: Build app
        run: npm run build

      # Unpacked app folder only; GloriaSetup replaces the NSIS installer.
      - name: Package unpacked app
        run: npx electron-builder --win --dir --publish never

      - name: Collect runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-dist | Out-Null
          Copy-Item -Path 'dist\win-unpacked\*' -Destination app-dist -Recurse -Force
          if (-not (Test-Path app-dist\Draco.exe)) { throw 'Draco.exe missing from app-dist' }

      - name: Make sure the release exists
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes

      - name: Pack and attach setup
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}

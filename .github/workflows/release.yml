# projectGloria app release. Copy to .github/workflows/release.yml and edit only the `build` job.
#
# Runs only when started on purpose: /monjita-github-release, or `gh workflow run release.yml`.
# Pushing to main never releases.
#
#   check   (shared)  version files agree, version not released yet, gloria.toml valid, picks newest gloria-setup
#   build   (this repo) builds the app and uploads its files as the artifact `app`
#   release (shared)  packs with that gloria-setup + dry run (or, without gloria.toml, publishes the files as-is),
#                     then publishes GitHub Release v<version> with SHA256SUMS.txt
#
# The shared jobs live in projectGloria/GloriaSetup and are used from @main, so every release picks up
# the newest checks and the newest gloria-setup without editing this file.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything, but do not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: projectGloria/GloriaSetup/.github/workflows/app-check.yml@main

  build:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Set up Go (browser bridge host)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: host/go.mod
          cache: false

      - name: Restore Electron and electron-builder downloads
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Run tests
        shell: pwsh
        run: npm test

      - name: Fetch bundled runtime (yt-dlp, ffmpeg, node)
        shell: pwsh
        run: npm run runtime

      - name: Build browser bridge host
        shell: pwsh
        run: npm run host

      - name: Build app
        shell: pwsh
        run: npm run build

      - name: Package unpacked app
        shell: pwsh
        run: npx electron-builder --win --dir --publish never

      - name: Save Electron and electron-builder downloads
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Stage the unpacked app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Path 'dist\win-unpacked\*' -Destination stage -Recurse -Force
          if (-not (Test-Path 'stage\Draco.exe')) {
            throw 'Draco.exe missing from stage'
          }


      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app
          path: stage/
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [check, build]
    uses: projectGloria/GloriaSetup/.github/workflows/app-release.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.check.outputs.version }}
      installer: ${{ needs.check.outputs.installer == 'true' }}
      gloria_setup: ${{ needs.check.outputs.gloria_setup }}
      dry_run: ${{ inputs.dry_run }}

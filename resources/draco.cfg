# draco.cfg - default options for the `draco` command line.
#
# Write draco flags exactly as you would type them, one or more per line.
# Lines starting with # are comments. Everything here is commented out, so
# draco behaves as built until you remove a # in front of a line.
#
# The command line always wins: with "-N 16" here, `draco URL -N 4` uses 4.
# Run `draco --ignore-config URL` to skip this file for one run, or
# `draco --config-location D:\other.cfg URL` to read another one.
#
# Quotes group words; backslashes are literal, so Windows paths need no
# escaping. Quote a "#" you mean literally, e.g. -f "#3".
#
# This file survives updates. Uninstalling keeps a copy at
# %APPDATA%\Draco\draco.cfg.bak, which a reinstall restores.

# ---- Where files go ---------------------------------------------------------

# Download folder when you start draco from your home folder - where Windows
# Terminal opens - or from System32. Start it from any other folder and it saves
# there instead. Default: your Downloads folder. F2 > Save to can set this line.
# -P "D:\Videos"

# Output template. "/" makes folders; each %(field)s is filled per download.
# Fields: title, ext, id, uploader, upload_date, height, resolution,
#         format_id, playlist, playlist_index. A missing field becomes NA.
# -o "%(uploader)s/%(title)s.%(ext)s"
# -o "%(playlist)s/%(playlist_index)s - %(title)s.%(ext)s"
# -o "%(upload_date)s %(title)s [%(resolution)s].%(ext)s"

# ---- Quality ----------------------------------------------------------------

# best (default), worst, bestaudio, or a height such as 1080 / 720.
# -f 1080

# Audio only, for every download.
# -x

# ---- Network ----------------------------------------------------------------

# Connections per download (1-64, default 8).
# -N 16

# Downloads running at once (1-32, default 3).
# -c 3

# Total speed cap, e.g. 500K, 4M.
# -r 4M

# Retries per failed request (default 5) and stall timeout in seconds (default 30).
# -R 5
# --socket-timeout 30

# HTTP(S) proxy.
# --proxy http://127.0.0.1:8080

# Use a browser's cookies for sites that need a login (yt-dlp).
# chrome, edge, brave, firefox, chromium, opera, vivaldi
# --cookies-from-browser firefox

# ---- Behaviour --------------------------------------------------------------

# For watch?v=...&list=... links, take only that video.
# --no-playlist

# No live progress lines (handy when logging to a file).
# --no-progress

# ---- Optional yt-dlp media processing ----------------------------------------
# These options use yt-dlp for downloading and processing media.
# -S lang,quality,res,fps,hdr:12,vbr,vcodec,channels,abr,acodec
# --merge-output-format mkv
# --write-thumbnail
# --convert-thumbnails png
# --embed-thumbnail
# --embed-metadata
# --embed-chapters
# --windows-filenames
# --no-mtime
